name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0-dev'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            ext: so
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: gcc
            ext: so
          - os: darwin
            arch: arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            cc: clang
            ext: dylib
          - os: windows
            arch: amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cc: gcc
            ext: dll

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Set up MSYS2 (Windows only)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false
          path-type: inherit

      - name: Test
        working-directory: plugins/qoder
        env:
          CGO_LDFLAGS: ${{ matrix.os == 'darwin' && '-Wl,-undefined,dynamic_lookup' || '' }}
        run: go test -count=1 ./...

      - name: Build
        working-directory: plugins/qoder
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
          CGO_LDFLAGS: ${{ matrix.os == 'darwin' && '-Wl,-undefined,dynamic_lookup' || '' }}
        run: go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o qoder.${{ matrix.ext }} .

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: powershell
        run: Compress-Archive -Path "plugins/qoder/qoder.dll" -DestinationPath "qoder-cpa-plugin-${{ matrix.os }}-${{ matrix.arch }}.zip" -Force

      - name: Package (non-Windows)
        if: matrix.os != 'windows'
        run: zip -j "qoder-cpa-plugin-${{ matrix.os }}-${{ matrix.arch }}.zip" "plugins/qoder/qoder.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: qoder-cpa-plugin-${{ matrix.os }}-${{ matrix.arch }}
          path: qoder-cpa-plugin-${{ matrix.os }}-${{ matrix.arch }}.zip
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: qoder-cpa-plugin ${{ steps.version.outputs.version }}
          files: artifacts/*.zip
          body: |
            # qoder-cpa-plugin ${{ steps.version.outputs.version }}

            Qoder plugin for CLIProxyAPI: CN + Intl in one provider.

            ## Downloads
            - `qoder-cpa-plugin-linux-amd64.zip`
            - `qoder-cpa-plugin-linux-arm64.zip`
            - `qoder-cpa-plugin-darwin-arm64.zip`
            - `qoder-cpa-plugin-windows-amd64.zip`

            ## Install
            Put `qoder.so` into CPA's plugin directory and enable it in `config.yaml`:

            ```yaml
            plugins:
              enabled: true
              dir: plugins
              configs:
                qoder:
                  enabled: true
            ```
